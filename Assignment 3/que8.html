<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Card</title>
</head>
<body>

    <h1>Global Knowledge School</h1>
    <h2>Student Report Card</h2>
    <p><strong>Student Name:</strong> Alex Johnson</p>

    <table border="1" width="500">
        <tr title="Column Headers">
            <th>Subject</th>
            <th>Max Marks</th>
            <th>Marks Obtained</th>
            <th>Grade</th>
        </tr>
        
        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>95</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>100</td>
            <td>92</td>
            <td>A</td>
        </tr>
        <tr>
            <td>English</td>
            <td>100</td>
            <td>88</td>
            <td>B+</td>
        </tr>
        <tr>
            <td>History</td>
            <td>100</td>
            <td>85</td>
            <td>B</td>
        </tr>
        <tr>
            <td rowspan="2">Languages</td>
            <td>50</td>
            <td>45</td>
            <td>A+</td>
        </tr>
        <tr>
            <td>50</td>
            <td>42</td>
            <td>A</td>
        </tr>

        <tr title="Final Calculation">
            <td colspan="2"><strong>Total</strong></td>
            <td colspan="2"><strong>447 / 500</strong></td>
        </tr>
        <tr>
            <td colspan="2"><strong>Percentage</strong></td>
            <td colspan="2"><strong>89.4%</strong></td>
        </tr>
    </table>

</body>
</html>
